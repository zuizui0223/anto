name: ANTO v30 original patristic-distance and expression-novelty heldout errors

on:
  push:
    branches:
      - 'analysis/anto-v30-*'
    paths:
      - 'scripts/analyze_original_petunieae_patristic_prediction_v30.py'
      - 'tests/test_original_petunieae_patristic_prediction_v30.py'
      - 'results/petunieae_patristic_prediction_gaps_v30_20261114.json'
      - 'docs/PETUNIEAE_V30_PHYLOGENETIC_PREDICTION_GAPS_20261114.md'
      - '.github/workflows/anto-v30-patristic-prediction.yml'
  pull_request:
    paths:
      - 'scripts/analyze_original_petunieae_patristic_prediction_v30.py'
      - 'tests/test_original_petunieae_patristic_prediction_v30.py'
      - 'results/petunieae_patristic_prediction_gaps_v30_20261114.json'
      - 'docs/PETUNIEAE_V30_PHYLOGENETIC_PREDICTION_GAPS_20261114.md'
      - '.github/workflows/anto-v30-patristic-prediction.yml'

permissions:
  contents: read

jobs:
  source-patristic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Negative controls for original branch lengths, exact folds and training-only prediction
        run: python -m unittest discover -s tests -p test_original_petunieae_patristic_prediction_v30.py -v
      - name: Verify prior source-locked fine topology and separate published-tree negative controls
        run: |
          python -m unittest discover -s tests -p test_original_petunieae_fine_discordance_v29.py -v
          python -m unittest discover -s tests -p test_original_petunieae_alternative_trees_v28.py -v
      - name: Authenticated original 2023 Newick and processed RNA HPLC versus training-distance error
        run: |
          python scripts/analyze_original_petunieae_patristic_prediction_v30.py \
            --expected-v26 results/petunieae_2023_original_species_pigment_prediction_v26_20261028.json \
            --expected-v27 results/petunieae_original_tree_clade_holdout_v27_20261114.json \
            --expected-v28 results/petunieae_alternative_published_phylogenies_v28_20261114.json \
            --expected-v29 results/petunieae_fine_discordance_label_reference_v29_20261114.json \
            --output /tmp/anto_v30_original_patristic_vs_expression_novelty.json
      - name: Verify immutable source-derived readout if frozen
        run: |
          if [ -f results/petunieae_patristic_prediction_gaps_v30_20261114.json ]; then
            python - <<'PY'
          import json
          old=json.load(open('results/petunieae_patristic_prediction_gaps_v30_20261114.json'))
          new=json.load(open('/tmp/anto_v30_original_patristic_vs_expression_novelty.json'))
          assert old==new,"V30_ORIGINAL_PATRISTIC_SOURCE_READOUT_DRIFT"
          assert new['original_source_v26_to_v29_all_receipts_exactly_replayed']
          assert new['n_original_2023_ingroup_species']==59
          assert new['n_original_2023_and_2024_focal_overlap']==31
          assert new['multiple_cutoff_spearman_and_tertiles_no_inferential_p_values']
          print('ANTO_V30_ALL_SOURCE_RECEIPTS_AND_DISTANCE_ERROR_REPLAY_SUCCESS')
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: anto-v30-source-original-patristic-training-gap-expression-novelty-error
          path: /tmp/anto_v30_original_patristic_vs_expression_novelty.json
          retention-days: 90
