name: ANTO v33 same-target same-training-size clade control
on:
  push:
    branches: ['analysis/anto-v33-*']
    paths:
      - 'scripts/analyze_target_size_controls_v33.py'
      - 'tests/test_target_size_controls_v33.py'
      - 'docs/PETUNIEAE_V33*'
      - 'results/petunieae_target_size_control_v33_20261114*'
      - '.github/workflows/anto-v33-target-size-matched.yml'
  pull_request:
    paths:
      - 'scripts/analyze_target_size_controls_v33.py'
      - 'tests/test_target_size_controls_v33.py'
      - 'docs/PETUNIEAE_V33*'
      - 'results/petunieae_target_size_control_v33_20261114*'
      - '.github/workflows/anto-v33-target-size-matched.yml'
permissions:
  contents: read
jobs:
  matched-training-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing test and numerical dependencies
        run: python -m pip install numpy scipy biopython
      - name: New adversarial count target leakage and algebra checks
        run: python -m unittest discover -s tests -p test_target_size_controls_v33.py -v
      - name: Complete repository tests
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/anto_v33_tests.log 2>&1
          STATUS=$?
          tail -45 /tmp/anto_v33_tests.log
          exit "$STATUS"
      - name: Fetch four original sources with bounded transient transport retries
        run: |
          for attempt in 1 2 3; do
            if python scripts/fetch_verified_osf_v31.py --cache /tmp/anto_v33_source_cache --status /tmp/anto_v33_source_status.json; then
              break
            fi
            python - <<'PY'
          import json
          p=json.load(open('/tmp/anto_v33_source_status.json'))
          for x in p['files'].values():
              if x.get('http_status') in (401,403) or x.get('error_type')=='ValueError':
                  raise SystemExit('Permission or identity failure: no alternate access or substitution')
          PY
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
      - name: Replay complete v32 source result and compare target-count matched training designs
        run: |
          EXTRA=()
          if [ -f results/petunieae_target_size_control_v33_20261114.json ]; then
            EXTRA=(--expected results/petunieae_target_size_control_v33_20261114.json)
          fi
          python scripts/analyze_target_size_controls_v33.py --source-cache /tmp/anto_v33_source_cache --output /tmp/anto_v33_result.json "${EXTRA[@]}"
      - name: Verify full regenerated output against compact immutable receipt if present
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('results/petunieae_target_size_control_v33_20261114.receipt.json')
          if p.exists():
              receipt=json.loads(p.read_text())
              raw=Path('/tmp/anto_v33_result.json').read_bytes()
              assert hashlib.sha256(raw).hexdigest()==receipt['full_result_sha256']
              assert len(raw)==receipt['full_result_bytes']
              d=json.loads(raw)
              assert d['matched_target_n']==59 and d['control_repetitions']==31
              print('ANTO_V33_EXACT_FULL_SOURCE_RESULT_REPLAY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anto-v33-original-source-target-size-matched-results
          path: |
            /tmp/anto_v33_result.json
            /tmp/anto_v33_tests.log
            /tmp/anto_v33_source_status.json
          retention-days: 90
