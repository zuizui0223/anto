name: ANTO v57 original Physalis and Mertensia external cohort source gate
on:
  push:
    branches: ['analysis/anto-v57-*']
    paths:
      - 'data/external/anto_v57*'
      - 'docs/ANTO_V57*'
      - 'scripts/discover_original_Physalis_Mertensia_v57.py'
      - 'tests/test_original_Physalis_Mertensia_v57.py'
      - '.github/workflows/anto-v57-independent-original-source-gate.yml'
  pull_request:
    branches: ['analysis/anto-v56-*']
permissions:
  contents: read
jobs:
  original_dryad_author_source_metadata_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source-grain, no-outcome, DOI and derived-source controls
        run: python -m unittest discover -s tests -p 'test_original_Physalis_Mertensia_v57.py' -v
      - name: Inspect ONLY original Dryad and DOI-linked Zenodo publication metadata
        run: python scripts/discover_original_Physalis_Mertensia_v57.py
