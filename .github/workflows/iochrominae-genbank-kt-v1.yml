name: Ho-Smith Iochrominae original GenBank KT sequences
on:
  pull_request:
    paths:
      - "scripts/audit_iochrominae_original_genbank_kt_accessions_v1.py"
      - "tests/test_iochrominae_original_genbank_kt_v1.py"
      - "docs/IOCHROMINAE_2016_GENBANK_KT_SOURCE_REPLAY_V1.md"
      - ".github/workflows/iochrominae-genbank-kt-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-author-genbank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Biopython parser for original GenBank source records
        run: python -m pip install 'biopython>=1.84,<2'
      - name: Confirm 58-accession identity and inference ceilings
        run: python -m unittest discover -s tests -p test_iochrominae_original_genbank_kt_v1.py -v
      - name: Retrieve original author-registered nucleotide records from NCBI
        run: |
          python scripts/audit_iochrominae_original_genbank_kt_accessions_v1.py \
            --out /tmp/iochrominae-original-genbank-kt-source-v1.json
      - name: Inspect recovered original-source qualification
        run: |
          python - <<'PY'
          import json
          d=json.load(open("/tmp/iochrominae-original-genbank-kt-source-v1.json"))
          assert d["registered_accession_count"]==58
          assert d["source_records_recovered"]==58
          assert len(d["accessions"])==58
          assert not d["phenotypic_color_crosswalk_independently_qualified"]
          assert not d["regain_or_perpetuation_probability_estimated"]
          assert not d["original_sequences_embedded_in_result"]
          print("ORIGINAL_GENBANK_SOURCE_RETRIEVED",
                d["unique_organism_names_in_deposited_records"],
                d["source_record_gene_label_counts"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iochrominae-original-author-kt-source-audit
          path: /tmp/iochrominae-original-genbank-kt-source-v1.json
          retention-days: 90
