name: ANTO v27 real Petunieae tree-defined clade validation
on:
  push:
    branches:
      - 'analysis/anto-v27-*'
    paths:
      - 'scripts/analyze_original_petunieae_phylogeny_v27.py'
      - 'tests/test_original_petunieae_phylogeny_v27.py'
      - 'docs/PETUNIEAE_V27_TRUE_TREE_HOLDOUT_20261114.md'
      - 'results/petunieae_original_tree_clade_holdout_v27_20261114.json'
      - '.github/workflows/anto-v27-phylogenetic-holdout.yml'
  pull_request:
    paths:
      - 'scripts/analyze_original_petunieae_phylogeny_v27.py'
      - 'tests/test_original_petunieae_phylogeny_v27.py'
      - 'docs/PETUNIEAE_V27_TRUE_TREE_HOLDOUT_20261114.md'
      - 'results/petunieae_original_tree_clade_holdout_v27_20261114.json'
      - '.github/workflows/anto-v27-phylogenetic-holdout.yml'

permissions:
  contents: read

jobs:
  original-tree-clade-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Newick topology, original-tip and no-outcome-fold-selection adverse tests
        run: python -m unittest discover -s tests -p test_original_petunieae_phylogeny_v27.py -v
      - name: Keep the original v26 processed-species and prediction tests unchanged
        run: |
          python -m unittest discover -s tests -p test_original_petunieae_2023_species_prediction_v26.py -v
          python -m unittest discover -s tests -p test_petunieae_2023_processed_files_v26.py -v
      - name: Original byte-verified Petunieae dated tree and true phylogenetic clade holdouts
        run: |
          python scripts/analyze_original_petunieae_phylogeny_v27.py \
            --expected-v26 results/petunieae_2023_original_species_pigment_prediction_v26_20261028.json \
            --output /tmp/anto_v27_real_tree_holdout.json
      - name: Verify frozen v27 original-tree result if present
        run: |
          if [ -f results/petunieae_original_tree_clade_holdout_v27_20261114.json ]; then
            python - <<'PY'
          import json
          old=json.load(open('results/petunieae_original_tree_clade_holdout_v27_20261114.json'))
          new=json.load(open('/tmp/anto_v27_real_tree_holdout.json'))
          assert old==new,"V27_FROZEN_RECEIPT_DRIFT"
          assert old['original_tree_hash_and_byte_length_verified']
          assert old['source_tree_tip_audit']['source_tree_ingroups_reconciled']==59
          assert all(v['n_species_tested_once']==59 for v in old['evaluation'].values())
          assert old['not_visible_colour_or_ancestral_reexpression_or_fitness']
          print('ANTO_V27_ORIGINAL_TREE_FROZEN_REPLAY_SUCCESS')
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: anto-v27-source-verified-real-Petunieae-tree-clade-summary
          path: /tmp/anto_v27_real_tree_holdout.json
          retention-days: 90
