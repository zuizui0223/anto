name: anto synthetic validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum dependencies
        run: python -m pip install numpy scipy
      - name: Run CTMC, colonization, assay-design and evidence-gate tests
        run: python -m unittest discover -s tests -v
      - name: Replay smoke-check synthetic experiments
        run: |
          python scripts/run_synthetic_baselines.py --replicates 40 --horizon 8 --output /tmp/anto_synthetic.json
          python -c "import json; d=json.load(open('/tmp/anto_synthetic.json')); assert d['empirical_data_admitted'] is False; assert len(d['scenarios']) == 4; assert d['history_identifiability']['predictions']['visible_only']['accuracy'] == 1/3"
      - name: Reproduce source-audit and assay-rank gates
        run: |
          python scripts/run_empirical_gate_v3.py --output /tmp/anto_empirical_gate_v3.json
          python -c "import json; d=json.load(open('/tmp/anto_empirical_gate_v3.json')); assert d['empirical_inference_performed'] is False; assert d['literature_source_audit']['integrated_accessibility_systems'] == 0; assert d['three_history_designs']['colour_only']['rank_known_emissions'] == 1; assert d['four_history_designs']['two_ancestry_markers']['rank_known_emissions'] == 3; assert d['four_history_designs']['plus_ancestral_reuse_evidence']['rank_known_emissions'] == 4"

      - name: Verify real public SRA specimen crosswalk and inherited floral-trait polarity gate
        run: |
          python scripts/run_public_sra_intake_v4.py --out /tmp/anto_sra_v4.json
          python -c "import json; d=json.load(open('/tmp/anto_sra_v4.json')); assert d['ryukyu_n_runs']==6; assert d['manifest_n_runs']==25; assert not d['floral_reexpression_demonstrated']; assert d['unresolved_instrument_inconsistency']"
          python src/anto_ryukyu_polarity.py > /tmp/anto_ryukyu_polarity_v4.json
          python -c "import json; x=json.load(open('/tmp/anto_ryukyu_polarity_v4.json')); assert len(x['cases'])==12; assert x['rates_hypothetical'] and x['not_phenotype_transition_date']"

      - name: Verify real annotated Asteraceae reference CDSs and fail-closed Ryukyu molecular preflight
        run: |
          python scripts/run_molecular_preflight_v5.py --output /tmp/anto_molecular_preflight_v5.json
          python -c "import json; x=json.load(open('/tmp/anto_molecular_preflight_v5.json')); assert x['registered_screen_count'] == 18; assert x['focal_run_count'] == 6; assert x['n_candidate_sequences_supplied'] == 0; assert x['focal_gene_state'] == 'UNMEASURED'; assert set(x['references']) == {'DFR','ANS','GMYC1'}; assert x['ancestral_regain_demonstrated'] is False"
