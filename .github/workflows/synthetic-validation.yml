name: anto general evolutionary accessibility theory
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  theoretical-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install generic stochastic-model dependencies only
        run: python -m pip install numpy scipy
      - name: Test generic lineage transitions and propagation
        run: |
          python -m unittest discover -s tests -p 'test_model.py' -v
          python -m unittest discover -s tests -p 'test_colonization.py' -v
      - name: Test exact higher-order module accessibility and movement order
        run: python -m unittest discover -s tests -p 'test_joint_accessibility_v7.py' -v
      - name: Replay generic synthetic regional dispersal and state-identification examples
        run: |
          python scripts/run_synthetic_baselines.py --replicates 40 --horizon 8 --output /tmp/anto_synthetic.json
          python -c "import json; d=json.load(open('/tmp/anto_synthetic.json')); assert d['empirical_data_admitted'] is False; assert len(d['scenarios'])==4"
      - name: Replay exact first/pairwise vs joint module counterexample
        run: |
          python scripts/run_joint_accessibility_v7.py --output /tmp/anto_joint_accessibility_v7.json
          python -c "import json; d=json.load(open('/tmp/anto_joint_accessibility_v7.json')); x=d['distributions']; assert not d['empirical_plant_data_admitted']; assert d['Cirsium_empirical_owner']=='zuizui0223/aza3'; assert x['even_parity']['all_three_joint']=='0'; assert x['odd_parity']['all_three_joint']=='1/4'; assert d['exact_sharp_bound_p111_given_marginals_half_and_pairs_quarter']==['0','1/4']"
