name: Iochrominae Ho–Smith Dryad original source audit
on:
  pull_request:
    paths:
      - "scripts/audit_iochrominae_ho_smith_original_dryad_v1.py"
      - "tests/test_iochrominae_ho_smith_dryad_v1.py"
      - "docs/IOCHROMINAE_2016_ORIGINAL_SEQUENCE_SOURCE_GATE_V1.md"
      - ".github/workflows/iochrominae-ho-smith-dryad-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test zip, DOI and no-overclaim admission
        run: python -m unittest discover -s tests -p test_iochrominae_ho_smith_dryad_v1.py -v
      - name: Fetch original published 2016 Dryad archive via documented public GET API
        run: |
          python scripts/audit_iochrominae_ho_smith_original_dryad_v1.py \
            --output /tmp/iochrominae-2016-raw-source-audit.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/iochrominae-2016-raw-source-audit.json"))
          if p["source_status"]!="SOURCE_BYTES_VERIFIED":
              assert p["source_status"].startswith("SOURCE_FILE_ACCESS_RESTRICTED_HTTP_")
              assert p["scientific_admission"]=="SOURCE_ONLY_METADATA_FILES_UNAVAILABLE"
              assert p["coding_integrity_independently_replayed"] is False
              assert p["phenotypic_regain_or_fitness_estimated"] is False
              print("SOURCE_ACCESS_ABSTENTION_NOT_BIOLOGICAL_RESULT",
                    p["source_status"])
          else:
              assert p["source_bytes_downloaded"] is True
              print("SOURCE_BYTES_HASH_VERIFICATION_COMPLETED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iochrominae-2016-original-alignment-source-receipt
          path: /tmp/iochrominae-2016-raw-source-audit.json
          retention-days: 90
