name: ANTO v32 conditional molecular information beyond phylogenetic prediction
on:
  push:
    branches: ['analysis/anto-v32-*']
    paths:
      - 'scripts/analyze_phylo_expression_v32.py'
      - 'tests/test_phylo_expression_v32.py'
      - 'docs/PETUNIEAE_V32*'
      - 'results/petunieae_phylo_expression_v32_20261114*'
      - '.github/workflows/anto-v32-phylogeny-plus-expression.yml'
  pull_request:
    paths:
      - 'scripts/analyze_phylo_expression_v32.py'
      - 'tests/test_phylo_expression_v32.py'
      - 'docs/PETUNIEAE_V32*'
      - 'results/petunieae_phylo_expression_v32_20261114*'
      - '.github/workflows/anto-v32-phylogeny-plus-expression.yml'
permissions:
  contents: read
jobs:
  conditional-phylogenetic-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing numerical and repository test dependencies
        run: python -m pip install numpy scipy biopython
      - name: Verify new algebra and nested heldout-outcome isolation
        run: python -m unittest discover -s tests -p test_phylo_expression_v32.py -v
      - name: Run complete repository unittest suite
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/anto_v32_tests.log 2>&1
          STATUS=$?
          tail -45 /tmp/anto_v32_tests.log
          exit "$STATUS"
      - name: Obtain exactly the original four authenticated OSF files
        run: |
          python scripts/fetch_verified_osf_v31.py \
            --cache /tmp/anto_v32_source_cache \
            --status /tmp/anto_v32_source_status.json
      - name: Replay v31 and fit nested phylogeny-only and phylogeny-plus-expression
        run: |
          python scripts/analyze_phylo_expression_v32.py \
            --source-cache /tmp/anto_v32_source_cache \
            --output /tmp/anto_v32_result.json
      - name: Verify full regenerated record and compact receipt without changing scientific files
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('results/petunieae_phylo_expression_v32_20261114.receipt.json')
          if path.exists():
              receipt=json.loads(path.read_text())
              raw=Path('/tmp/anto_v32_result.json').read_bytes()
              assert len(raw)==receipt['full_result_bytes'],'V32_FULL_RESULT_SIZE_DRIFT'
              assert hashlib.sha256(raw).hexdigest()==receipt['full_result_sha256'],'V32_FULL_RESULT_DIGEST_DRIFT'
              result=json.loads(raw)
              assert result['primary_both_endpoints_improve_rmse_and_mae']==receipt['primary_gate']
              assert len(receipt['comparisons'])==8
              for row in receipt['comparisons']:
                  actual=result['designs'][row['design']]['endpoints'][row['endpoint']]
                  assert all(actual['risks'][key]==value for key,value in row['models'].items())
                  assert actual['added_expression']['RMSE_reduction_pct']==row['RMSE_reduction_pct']
                  assert actual['added_expression']['n_species_lower_squared_error']==row['positive_species']
                  assert actual['added_expression']['n_folds_positive']==row['positive_folds']
                  assert actual['added_expression']['equal_fold_MSE_gain']==row['equal_fold_MSE_gain']
                  assert actual['selected_eta_counts']==row['selected_eta_counts']
                  assert {k:v['RMSE_reduction_pct'] for k,v in actual['fixed_eta_sensitivity'].items()}==row['fixed_eta_RMSE_gains']
              print('ANTO_V32_FULL_RESULT_SHA256_AND_COMPACT_RECEIPT_REPLAY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anto-v32-authenticated-conditional-prediction
          path: |
            /tmp/anto_v32_result.json
            /tmp/anto_v32_tests.log
            /tmp/anto_v32_source_status.json
          retention-days: 90
