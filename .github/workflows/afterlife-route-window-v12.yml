name: ANTO v12 route-specific first-recovery window
on:
  pull_request:
    paths:
      - 'src/anto_afterlife_route_window_v12.py'
      - 'tests/test_afterlife_route_window_v12.py'
      - 'scripts/run_afterlife_route_window_v12.py'
      - '.github/workflows/afterlife-route-window-v12.yml'
  push:
    branches: [main]
    paths:
      - 'src/anto_afterlife_route_window_v12.py'
      - 'tests/test_afterlife_route_window_v12.py'
      - 'scripts/run_afterlife_route_window_v12.py'
      - '.github/workflows/afterlife-route-window-v12.yml'
permissions:
  contents: read
jobs:
  analytical-and-independent-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - run: python -m unittest discover -s tests -p test_afterlife_route_window_v12.py -v
      - run: python scripts/run_afterlife_route_window_v12.py --output /tmp/afterlife_v12.json --grid-csv /tmp/afterlife_v12_grid.csv
      - uses: actions/upload-artifact@v4
        with:
          name: anto-v12-route-window-model-only
          path: |
            /tmp/afterlife_v12.json
            /tmp/afterlife_v12_grid.csv
          if-no-files-found: error
