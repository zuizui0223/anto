name: ANTO v22 individual vs technical functional assay hierarchy
on:
  pull_request:
    paths:
      - 'scripts/anto_individual_function_assay_hierarchy_v22.py'
      - 'tests/test_individual_function_assay_hierarchy_v22.py'
      - 'docs/AFTERLIFE_V22_BIOLOGICAL_VS_TECHNICAL_ASSAYS.md'
      - 'results/anto_v22_individual_function_assay_20261026.json'
      - '.github/workflows/anto-v22-assay-hierarchy.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'scripts/anto_individual_function_assay_hierarchy_v22.py'
      - 'tests/test_individual_function_assay_hierarchy_v22.py'
      - 'results/anto_v22_individual_function_assay_20261026.json'
      - '.github/workflows/anto-v22-assay-hierarchy.yml'
permissions:
  contents: read
jobs:
  exact-biological-versus-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm v19/20 original-source grain and v21 assay-error safeguards
        run: |
          python -m unittest discover -s tests -p test_afterlife_empirical_admissibility_v19.py -v
          python -m unittest discover -s tests -p test_functional_assay_identifiability_v20.py -v
          python -m unittest discover -s tests -p test_fallible_function_assays_v21.py -v
      - name: Exact independent latent genotype and test-result enumeration
        run: python -m unittest discover -s tests -p test_individual_function_assay_hierarchy_v22.py -v
      - name: Reproduce frozen synthetic budget benchmarks and block empirical claims
        run: |
          python scripts/anto_individual_function_assay_hierarchy_v22.py --output /tmp/anto_v22.json
          python - <<'PY'
          import json
          from fractions import Fraction as F
          d=json.load(open('/tmp/anto_v22.json'))
          assert d['actual_qualified_complete_flower_function_assays']==0
          assert d['observed_original_source_taxa']==22
          assert d['source_DFR_CDS_annotation_is_not_a_function_assay']
          assert d['input_rates_are_hypothetical_not_calibrated']
          assert d['real_field_shared_batch_and_plant_relatedness_not_covered']
          assert d['no_natural_floral_trait_regain_heritability_or_fitness_measurement']
          assert d['Cirsium_organismal_empirical_owner']=='zuizui0223/aza3'
          w=d['mechanistic_single_call_nonidentifiability']
          assert w['same_observable_single_binary_call_probability']=='11/50'
          b=d['exact_four_call_biological_vs_technical_benchmarks']
          a=b['four_independent_plants_one_call']
          t=b['one_plant_four_technical_repeats_any_positive']
          assert a['false_taxon_screen_if_all_plants_incompetent']==t['false_taxon_screen_if_all_plants_incompetent']
          assert a['chance_at_least_one_TRULY_competent_plant_correctly_called']=='3424239/6250000'
          assert t['chance_at_least_one_TRULY_competent_plant_correctly_called']=='9999/50000'
          m=d['hypothetical_fixed_12_call_budget_search_under_declared_assumptions']
          for label,required in (
              ('independent_replicate_error_assumption',[6,2,2]),
              ('two_percent_per_plant_shared_handling_failure',[2,6,3])):
              x=m[label]['optimal_under_THIS_STIPULATED_likelihood_only']
              assert [x['n_biologically_distinct_plants'],x['technical_repeats_per_plant'],
                      x['minimum_positive_repeats_for_individual_call']]==required
          assert m['five_percent_per_plant_shared_handling_failure']['optimal_under_THIS_STIPULATED_likelihood_only'] is None
          print('ANTO_V22_SOURCE_AND_ASSAY_REPLICATION_PASS',json.dumps({
              'source_taxa':22,'actual_functional_assays':0,
              'synthetic_optimum_no_common_mode':[6,2,2],
              'synthetic_optimum_2percent_shared_error':[2,6,3],
              'NOT_a_real_taxon_sampling_recommendation':True
          },sort_keys=True))
          compact=json.dumps(d,sort_keys=True,ensure_ascii=False,separators=(',',':'))
          for i in range(0,len(compact),3000):
              print('ANTO_V22_EXACT_RECEIPT_CHUNK',i//3000,compact[i:i+3000])
          PY
      - name: Frozen source receipt check if available
        run: |
          if [ -f results/anto_v22_individual_function_assay_20261026.json ]; then
            python scripts/anto_individual_function_assay_hierarchy_v22.py \
              --output /tmp/anto_v22_receipt.json \
              --expected results/anto_v22_individual_function_assay_20261026.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: anto-v22-source-gated-hypothetical-assay-hierarchy
          path: /tmp/anto_v22.json
          retention-days: 90
