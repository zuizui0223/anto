name: ANTO v31 species-LOO distance and nearest-relative comparator
on:
  push:
    branches: ['analysis/anto-v31-*']
    paths:
      - 'scripts/analyze_petunieae_loo_distance_v31.py'
      - 'scripts/fetch_verified_osf_v31.py'
      - 'tests/test_petunieae_loo_distance_v31.py'
      - 'tests/test_osf_transport_v31.py'
      - 'docs/PETUNIEAE_V31*'
      - 'results/petunieae_species_loo_distance_v31_20261114.json'
      - '.github/workflows/anto-v31-species-loo-distance.yml'
  pull_request:
    paths:
      - 'scripts/analyze_petunieae_loo_distance_v31.py'
      - 'scripts/fetch_verified_osf_v31.py'
      - 'tests/test_petunieae_loo_distance_v31.py'
      - 'tests/test_osf_transport_v31.py'
      - 'docs/PETUNIEAE_V31*'
      - 'results/petunieae_species_loo_distance_v31_20261114.json'
      - '.github/workflows/anto-v31-species-loo-distance.yml'
permissions:
  contents: read
jobs:
  source-verified-species-loo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adverse numerical, distance-tie, leakage and comparator checks
        run: |
          python -m unittest discover -s tests -p test_petunieae_loo_distance_v31.py -v
          python -m unittest discover -s tests -p test_osf_transport_v31.py -v
      - name: Install existing repository test dependencies
        run: python -m pip install numpy scipy
      - name: Run complete repository unittest suite independently of source access
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/anto_v31_full_tests.log 2>&1
          STATUS=$?
          tail -55 /tmp/anto_v31_full_tests.log
          exit "$STATUS"
      - name: Read official public OSF metadata links and verify original source bodies
        if: always()
        run: |
          python scripts/fetch_verified_osf_v31.py \
            --cache /tmp/anto_v31_source_cache \
            --status /tmp/anto_v31_source_access_status.json
      - name: Replay original v26-v30 and calculate actual species LOO distances
        run: |
          python - <<'PY'
          import runpy,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import audit_petunieae_2023_processed_files_v26 as source
          registered={source.registered_location(record):record for key,record in source.FILES.items() if key!='pigment_cluster_source'}
          def verified_cache(url):
              if url not in registered:
                  raise ValueError('UNREGISTERED_ORIGINAL_SOURCE_REQUEST')
              record=registered[url]
              body=Path('/tmp/anto_v31_source_cache',record['file_id']+'.raw').read_bytes()
              source.verify_original(body,record)
              return body
          # Transport only: keep original numerical source modules unchanged.
          # Patch before importing analysis modules so each obtains verified bytes.
          source.get_official_file=verified_cache
          sys.argv=['analyze_petunieae_loo_distance_v31.py','--output','/tmp/anto_v31_original_source_result.json']
          expected=Path('results/petunieae_species_loo_distance_v31_20261114.json')
          if expected.exists():sys.argv+=['--expected',str(expected)]
          runpy.run_path('scripts/analyze_petunieae_loo_distance_v31.py',run_name='__main__')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anto-v31-original-source-species-LOO-distance-result
          path: |
            /tmp/anto_v31_original_source_result.json
            /tmp/anto_v31_full_tests.log
            /tmp/anto_v31_source_access_status.json
          retention-days: 90
