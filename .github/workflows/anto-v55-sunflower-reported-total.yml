name: ANTO v55 original sunflower reported-total visits, 51 physical fields
on:
  push:
    branches: ['analysis/anto-v55-*']
    paths:
      - 'data/external/anto_v55*'
      - 'docs/ANTO_V55*'
      - 'scripts/analyze_original_Mota_reported_total_bees_v55.py'
      - 'tests/test_original_Mota_reported_total_bees_v55.py'
      - 'results/anto_v55_sunflower_total_bee_field_holdout_20261119.json'
      - '.github/workflows/anto-v55-sunflower-reported-total.yml'
  pull_request:
    branches: ['analysis/anto-v54-*']
permissions:
  contents: read
jobs:
  original_mota_reported_total_visitor_field_holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strict no-imputation, source-quality and field-year prediction tests
        run: python -m unittest discover -s tests -p 'test_original_Mota_reported_total_bees_v55.py' -v
      - name: Original MD5 sunflower three files, 51 whole-field source holdouts and 200 visit placebo results
        shell: bash
        run: |
          if [ -f results/anto_v55_sunflower_total_bee_field_holdout_20261119.json ]; then
            python scripts/analyze_original_Mota_reported_total_bees_v55.py --check
          else
            python scripts/analyze_original_Mota_reported_total_bees_v55.py
          fi
