name: ANTO-SLK recurrent functional capacity v4
on:
  push:
    paths:
      - '**/*recurrent_capacity_v4*'
      - '**/*RECURRENT_CAPACITY_V4*'
      - '.github/workflows/slk-anto-recurrent-capacity-v4.yml'
  pull_request:
    paths:
      - 'src/anto_slk_recurrent_capacity_v4.py'
      - 'tests/test_slk_anto_recurrent_capacity_v4.py'
      - 'scripts/run_slk_anto_recurrent_capacity_v4.py'
      - 'docs/SLK_ANTO_RECURRENT_CAPACITY_V4.md'
      - 'results/slk_anto_recurrent_capacity_v4_summary.json'
      - '.github/workflows/slk-anto-recurrent-capacity-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recurrence-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy biopython openpyxl pandas
      - name: Full repository unit suite, including all prior models
        run: python -m unittest discover -s tests -v
      - name: Reproduce and compare selected numerical results
        run: |
          python scripts/run_slk_anto_recurrent_capacity_v4.py --output /tmp/recurrent-capacity-v4.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/recurrent-capacity-v4.json'))
          s=json.load(open('results/slk_anto_recurrent_capacity_v4_summary.json'))
          assert r['activation_critical_exact']=='1651/2268'
          assert not r['natural_regain_demonstrated']
          assert not r['organism_extinction_inferred']
          rows={x['activation']:x for x in r['activation_sweep']}
          for old in s['selected_scenarios']:
              new=rows[old['activation']]
              assert old['regime']==new['regime']
              assert abs(old['first_expression_probability']-new['first_expression_probability'])<1e-12
              for a,b in zip(old['survival_lower'],new['survival_lower']):
                  assert abs(a-b)<1e-10
          assert rows[0.3]['survival_lower'][1]>0.35
          assert rows[0.9]['survival_upper'][1]==0
          assert rows[0.3]['first_expression_probability']<rows[0.9]['first_expression_probability']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anto-slk-recurrent-capacity-v4
          path: /tmp/recurrent-capacity-v4.json
